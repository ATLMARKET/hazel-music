<!doctype html>
<html lang="en-US">
<head>

<title>Hazel and the Christmas Star</title>
<style>
html,body{height:100%;margin:0}body{box-sizing:border-box;padding:.6rem;overflow-x:hidden}

body::before{content:"";position:fixed;inset:0;z-index:-1;background:url(images/couverture.webp) center bottom/contain no-repeat}

</style>
</head>
<body>
<main>
<h1>Hazel and the Christmas Star</h1>
<p>The songs from the book</p>
<section><h2>A Party for Pompom</h2><audio controls preload="none" src="audio/a-party-for-pompom.mp3"></audio></section>
